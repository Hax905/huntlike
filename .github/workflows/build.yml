# Builds the mod on every push to main and on pull requests.
# If the build fails, the full log is pushed to the "ci-log" branch so it can be read with git.

name: build
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: |
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build.log
      - name: server smoke test
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n' > run/server.properties
          (sleep 150; echo "stop") | timeout 420 ./gradlew runServer --console=plain > server.log 2>&1 || true
          grep -E "Done \(|ERROR|Exception|huntlike" server.log | head -80
          grep -q "Done (" server.log
      - name: client game test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "4.5"
          __GLX_VENDOR_LIBRARY_NAME: mesa
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils mesa-vulkan-drivers libvulkan1 libegl1 vulkan-tools > /dev/null
          cat > /tmp/run-client.sh <<'SCRIPT'
          glxinfo -B 2>&1 | head -30 || true
          vulkaninfo --summary 2>&1 | head -40 || true
          timeout 900 ./gradlew runClientGameTest --console=plain 2>&1
          SCRIPT
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX" bash /tmp/run-client.sh | tee client.log
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: publish build log
        if: always()
        run: |
          mkdir -p /tmp/log && cp build.log /tmp/log/build.log || echo "no log" > /tmp/log/build.log
          cp server.log /tmp/log/server.log || true
          cp client.log /tmp/log/client.log || true
          mkdir -p /tmp/log/screenshots && find . -path ./.gradle -prune -o -name "*.png" -path "*screenshots*" -print -exec cp {} /tmp/log/screenshots/ \; || true
          find . -path ./.gradle -prune -o -name "latest.log" -print -exec cp {} /tmp/log/client-latest.log \; || true
          echo "${{ job.status }} ${{ github.sha }}" > /tmp/log/status.txt
          cd /tmp/log
          git init -q -b ci-log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Build log for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log
