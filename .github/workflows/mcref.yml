# Manual job: dumps the public API signatures (javap) of Minecraft and Fabric API
# to the temporary "mc-ref" branch, for reference while writing code.

name: mcref
on: workflow_dispatch

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew compileJava compileClientJava --console=plain
      - name: dump signatures
        run: |
          mkdir -p /tmp/out
          find ~/.gradle "$GITHUB_WORKSPACE/.gradle" -name "*.jar" 2>/dev/null | grep -v -- "-sources" | sort > /tmp/out/all-jars.txt
          grep -i -E "minecraft|fabric" /tmp/out/all-jars.txt | grep -v -E "fabric-loom|loader|mixin|tiny|mapping|intermediary|unpick|mercury|stitch|class-tweaker" > /tmp/jars.txt || true
          cp /tmp/jars.txt /tmp/out/used-jars.txt
          : > /tmp/seen.txt
          while read -r jar; do
            unzip -Z1 "$jar" 2>/dev/null | grep '\.class$' | grep -v -E '\$[0-9]' | sed 's/\.class$//' | grep -v -x -F -f /tmp/seen.txt > /tmp/cls.txt || true
            [ -s /tmp/cls.txt ] || continue
            cat /tmp/cls.txt >> /tmp/seen.txt
            sed 's#/[^/]*$##' /tmp/cls.txt | sort -u > /tmp/pkgs.txt
            while read -r pkg; do
              mkdir -p "/tmp/out/$(dirname "$pkg")"
              grep -E "^${pkg}/[^/]+$" /tmp/cls.txt | tr '/' '.' > /tmp/pc.txt
              xargs -a /tmp/pc.txt -d '\n' javap -protected -cp "$jar" >> "/tmp/out/${pkg}.txt" 2>>/tmp/out/javap-errors.txt || true
            done < /tmp/pkgs.txt
          done < /tmp/jars.txt
          find /tmp/out -name "*.txt" | wc -l
      - name: push
        run: |
          cd /tmp/out
          git init -q -b mc-ref
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "API signatures"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mc-ref
