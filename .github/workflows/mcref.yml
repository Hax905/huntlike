# Manual job: dumps the public API signatures (javap) of Minecraft and Fabric API
# to the temporary "mc-ref" branch, for reference while writing code.

name: mcref
on:
  workflow_dispatch:
    inputs:
      cleanup:
        description: 'Delete the mc-ref branch instead'
        default: 'false'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - name: cleanup
        if: ${{ inputs.cleanup == 'true' }}
        run: |
          git init -q /tmp/c && cd /tmp/c
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete mc-ref || true
          exit 1
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew compileJava compileClientJava --console=plain
      - name: dump signatures
        run: |
          mkdir -p /tmp/out
          find ~/.gradle "$GITHUB_WORKSPACE/.gradle" -name "*.jar" 2>/dev/null | grep -v -- "-sources" | sort > /tmp/out/all-jars.txt
          grep -i -E "minecraft|fabric" /tmp/out/all-jars.txt | grep -v -E "fabric-loom|loader|mixin|tiny|mapping|intermediary|unpick|mercury|stitch|class-tweaker" > /tmp/jars.txt || true
          cp /tmp/jars.txt /tmp/out/used-jars.txt
          : > /tmp/seen.txt
          while read -r jar; do
            unzip -Z1 "$jar" 2>/dev/null | grep '\.class$' | grep -v -E '\$[0-9]' | sed 's/\.class$//' | grep -v -x -F -f /tmp/seen.txt > /tmp/cls.txt || true
            [ -s /tmp/cls.txt ] || continue
            cat /tmp/cls.txt >> /tmp/seen.txt
            sed 's#/[^/]*$##' /tmp/cls.txt | sort -u > /tmp/pkgs.txt
            while read -r pkg; do
              mkdir -p "/tmp/out/$(dirname "$pkg")"
              grep -E "^${pkg}/[^/]+$" /tmp/cls.txt | tr '/' '.' > /tmp/pc.txt
              xargs -a /tmp/pc.txt -d '\n' javap -protected -cp "$jar" >> "/tmp/out/${pkg}.txt" 2>>/tmp/out/javap-errors.txt || true
            done < /tmp/pkgs.txt
          done < /tmp/jars.txt
          find /tmp/out -name "*.txt" | wc -l
          mkdir -p /tmp/out/vanilla-data
          for jar in $(grep -E "minecraft-(common|clientOnly)" /tmp/jars.txt); do
            (cd /tmp/out/vanilla-data && unzip -q -o "$jar" 'data/minecraft/advancement/story/*' 'data/minecraft/advancement/husbandry/root.json' 'data/minecraft/tags/entity_type/*' 'data/minecraft/recipe/bread.json' 'assets/minecraft/lang/en_us.json' 'assets/minecraft/items/egg.json' 'assets/minecraft/items/shield.json' 'assets/minecraft/items/trident.json' 'assets/minecraft/models/item/shield*' 'assets/minecraft/models/item/trident*' 'data/minecraft/tags/item/enchantable/*' 'data/minecraft/enchantment/mending.json' 'data/minecraft/enchantment/unbreaking.json' || true)
          done
          # Bytecode of a few classes worth copying from.
          mkdir -p /tmp/out/code
          for c in net.minecraft.client.renderer.special.ShieldSpecialRenderer net.minecraft.client.renderer.special.TridentSpecialRenderer net.minecraft.client.renderer.entity.EndermanRenderer net.minecraft.client.renderer.entity.layers.EnderEyesLayer net.minecraft.client.renderer.entity.ZombieRenderer net.minecraft.client.renderer.entity.HumanoidMobRenderer net.minecraft.client.model.animal.cow.CowModel net.minecraft.client.model.animal.sheep.SheepModel net.minecraft.client.model.animal.sheep.SheepFurModel net.minecraft.client.model.animal.chicken.ChickenModel net.minecraft.client.model.animal.pig.PigModel net.minecraft.client.model.QuadrupedModel net.minecraft.client.model.animal.wolf.WolfModel net.minecraft.client.renderer.entity.SheepRenderer net.minecraft.client.renderer.entity.layers.SheepWoolLayer net.minecraft.world.level.block.Block net.minecraft.world.level.block.SlimeBlock net.minecraft.world.entity.Entity net.minecraft.world.entity.LivingEntity net.minecraft.world.entity.animal.equine.AbstractHorse net.minecraft.world.item.Item net.minecraft.world.item.Items net.minecraft.client.renderer.ItemInHandRenderer net.minecraft.client.renderer.entity.player.AvatarRenderer net.minecraft.client.renderer.entity.player.PlayerRenderer net.minecraft.world.entity.animal.equine.SkeletonHorse; do
            for jar in $(grep -E "minecraft-(common|clientOnly)" /tmp/jars.txt); do
              javap -c -p -cp "$jar" "$c" > "/tmp/out/code/$c.txt" 2>/dev/null && break
            done
          done
      - name: push
        run: |
          cd /tmp/out
          git init -q -b mc-ref
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "API signatures"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mc-ref
